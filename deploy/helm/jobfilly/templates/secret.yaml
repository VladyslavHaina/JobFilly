{{- /* Not rendered when existingSecret names a Secret the user made. Empty values are left out, so
the server stops with one clear message ("DATABASE_URL is required") instead of starting half set up. */ -}}
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "jobfilly.fullname" . }}
  labels:
    {{- include "jobfilly.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with include "jobfilly.databaseUrl" . }}
  DATABASE_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.secretKey }}
  JOBFILLY_SECRET_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.googleClientId }}
  JOBFILLY_GOOGLE_CLIENT_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.googleClientSecret }}
  JOBFILLY_GOOGLE_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
{{- end }}
