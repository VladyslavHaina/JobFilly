# The test stack's reverse proxy (docs/mvp/README.md › The test stack).
#   :8080  round-robin over the replicas whose /api/health/ready answers 200
#   :8081  app-a directly, :8082 app-b, :8083 app-c (MVP 3), for read-only checks: no health
#          check, so a replica's own answer (a 503 while it isn't ready) comes through as it is
#   :8084  the fake Google authorisation server (MVP 3), for the browser's sign-in
# Replicas are found through Docker's DNS and looked up again while running, so the proxy starts
# before them and follows a replica that is killed and started again.

global
  log stdout format raw local0 info

resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 1s
  hold other 1s
  hold refused 1s
  hold nx 1s
  hold timeout 1s
  hold obsolete 1s

defaults
  mode http
  log global
  option httplog
  option forwardfor
  timeout connect 5s
  timeout http-request 10s
  # Live updates are long-lived responses with a heartbeat every 15 seconds.
  timeout client 60s
  timeout server 60s
  default-server init-addr last,libc,none resolvers docker

frontend balanced
  bind :8080
  default_backend replicas

# A replica that turns not ready (shutting down, database gone) is out within about 2 seconds,
# inside its 5-second drain; requests already running on it finish.
backend replicas
  balance roundrobin
  option httpchk
  http-check send meth GET uri /api/health/ready ver HTTP/1.1 hdr Host proxy
  http-check expect status 200
  server app-a app-a:9090 check inter 1s fall 2 rise 1
  server app-b app-b:9090 check inter 1s fall 2 rise 1
  server app-c app-c:9090 check inter 1s fall 2 rise 1

frontend app-a-direct
  bind :8081
  default_backend app-a

backend app-a
  server app-a app-a:9090

frontend app-b-direct
  bind :8082
  default_backend app-b

backend app-b
  server app-b app-b:9090

frontend app-c-direct
  bind :8083
  default_backend app-c

backend app-c
  server app-c app-c:9090

frontend oauth-direct
  bind :8084
  default_backend oauth

backend oauth
  server oauth oauth:8080
